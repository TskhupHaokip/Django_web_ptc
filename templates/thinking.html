
  <style>
    /* Core Thinking Animation Container */

    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700&display=swap');
  
    .thinking-container {
      display: none;
      align-items: center;
      font-size: 18px;
      font-weight: bold;
      font-family: "Audiowide", sans-serif;
      color:  #60A5FA;
      font-weight: bold;
      gap: 6px;
    }

    .thinking-container.show {
    display: inline-flex;
  }

    /* Dots Wrapper */
    .dot-bubble {
      display: flex;
      align-items: center;
      gap: 4px;
      height: 16px;
    }

    /* The Dots Base Style */
    .dot {
      width: 6px;
      height: 6px;
      background-color: #8e05e9;
      color: aqua;
      color: transparent;
      align-self: center;
      border-radius: 50%;
      /* Bounces and fades infinitely over 1.4 seconds */
      animation: thinkingWave 1.4s infinite ease-in-out both;
    }

    /* Animation Delays for the Wave Effect */
    .dot:nth-child(1) {
      animation-delay: -0.32s;
    }

    .dot:nth-child(2) {
      animation-delay: -0.16s;
    }

    /* Keyframe Definition: Controls Height and Opacity */
    @keyframes thinkingWave {
      0%, 80%, 100% {
        transform: translateY(0);
        opacity: 0.3;
      }
      40% {
        transform: translateY(-5px);
        opacity: 1;
      }
    }
  </style>

    <div class="thinking-container">
      Thinking
      <div class="dot-bubble">
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </div>
    </div>
