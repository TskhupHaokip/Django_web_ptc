<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900">
    <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#08080d"/>
            <stop offset="55%" stop-color="#171126"/>
            <stop offset="100%" stop-color="#351a5e"/>
        </linearGradient>

```
    <radialGradient id="glow">
        <stop offset="0%" stop-color="#7b42bc" stop-opacity=".35"/>
        <stop offset="100%" stop-color="#7b42bc" stop-opacity="0"/>
    </radialGradient>
</defs>

<!-- Background -->
<rect width="600" height="900" fill="url(#bg)"/>

<!-- Cinematic glow -->
<circle cx="300" cy="390" r="280" fill="url(#glow)"/>

<!-- Film frame -->
<rect
    x="170"
    y="280"
    width="260"
    height="190"
    rx="18"
    fill="#0b0b10"
    stroke="#6f4a91"
    stroke-width="4"
/>

<!-- Film holes -->
<g fill="#6f4a91">
    <rect x="190" y="300" width="28" height="18" rx="4"/>
    <rect x="382" y="300" width="28" height="18" rx="4"/>
    <rect x="190" y="432" width="28" height="18" rx="4"/>
    <rect x="382" y="432" width="28" height="18" rx="4"/>
</g>

<!-- Broken image symbol -->
<path
    d="M230 420 L285 365 L325 405 L350 380 L400 430"
    fill="none"
    stroke="#9b72c2"
    stroke-width="8"
    stroke-linecap="round"
    stroke-linejoin="round"
/>

<circle cx="285" cy="335" r="15" fill="#9b72c2"/>

<!-- Main text -->
<text
    x="300"
    y="535"
    text-anchor="middle"
    fill="#ffffff"
    font-family="Arial, Helvetica, sans-serif"
    font-size="34"
    font-weight="600">
    IMAGE FAILED
</text>

<text
    x="300"
    y="575"
    text-anchor="middle"
    fill="#9b9ba5"
    font-family="Arial, Helvetica, sans-serif"
    font-size="18">
    Poster unavailable
</text>

<!-- Decorative line -->
<rect
    x="235"
    y="615"
    width="130"
    height="3"
    rx="2"
    fill="#7b42bc"
/>
```

</svg>
